<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game Jeopardy - Gamers Week</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body class="p-board">
<div class="frame">
  <div class="bar">
    <h1>Game Jeopardy <small>· Gamers Week</small></h1>
    <nav>
      <a class="btn" href="index.html">&larr; Main menu</a>
      <button class="btn" id="random">Random</button>
      <button class="btn" id="reset">Reset</button>
    </nav>
  </div>
  <div class="cats" id="cats"></div>
  <p class="note" id="note"></p>
</div>

<script src="assets/data.js"></script>
<script src="assets/common.js"></script>
<script>
const wrap = document.getElementById('cats');

function render() {
  wrap.textContent = '';
  DATA.forEach(c => {
    const left = c.questions.filter(q => !used.has(c.key, q.n)).length;
    const a = document.createElement('a');
    a.className = 'cat' + (left === 0 ? ' done' : '');
    a.href = 'category.html?c=' + c.key + tvQS();
    a.setAttribute('aria-label', c.en);
    a.innerHTML = '<span class="jp"></span><span class="en"></span><span class="left"></span>';
    a.children[0].textContent = c.jp;
    a.children[1].textContent = c.en;
    a.children[2].textContent = left + ' left';
    wrap.append(a);
  });
  const left = DATA.reduce((s, c) => s + c.questions.filter(q => !used.has(c.key, q.n)).length, 0);
  const total = DATA.reduce((s, c) => s + c.questions.length, 0);
  document.getElementById('note').textContent = left + ' of ' + total + ' questions left';
}

document.getElementById('random').onclick = () => {
  const pool = [];
  DATA.forEach(c => c.questions.forEach(q => { if (!used.has(c.key, q.n)) pool.push([c.key, q.n]); }));
  if (!pool.length) { alert('All questions have been used. Press Reset to start over.'); return; }
  const [k, n] = pool[Math.floor(Math.random() * pool.length)];
  location.href = 'question.html?c=' + k + '&n=' + n + tvQS();
};
document.getElementById('reset').onclick = () => {
  if (confirm('Reset the board? All questions will be available again.')) { used.clear(); render(); }
};

window.onSharedChange = render;
// coming back with the browser Back button restores the page from cache; redraw so counts are current
window.addEventListener('pageshow', e => { if (e.persisted) render(); });
window.pageView = () => ({ page: 'board' });
render();
announce(window.pageView());
</script>
</body>
</html>
