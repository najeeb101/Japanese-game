<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Question - Game Jeopardy - Gamers Week</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css?v=4">
</head>
<body class="p-question">
<div class="frame">
  <div class="q-top">
    <a class="btn tvhide" id="menu" href="index.html">&#8962; Main menu</a>
    <a class="btn tvhide" id="back" href="board.html">&larr; Numbers</a>
    <div class="q-tag"><span class="jp" id="jp"></span><span class="en" id="en"></span><span class="no" id="no"></span></div>
    <span class="diff" id="diff" hidden></span>
  </div>

  <div class="q-panel" id="panel">
    <div class="q-stage"><h2 class="q-prompt" id="prompt"></h2></div>
    <div id="media"></div>
    <div class="q-actions tvhide">
      <button class="btn hintbtn" id="hint">&#128161; Hint</button>
      <button class="btn correctbtn" id="correct">&#10004; Correct answer</button>
    </div>
    <div class="choices" id="choices"></div>
    <div class="answer" id="answer" aria-live="polite"><small id="a-label">Correct answer</small><b id="a-title"></b><span id="a-detail"></span></div>
  </div>
</div>

<div class="lightbox" id="lightbox" role="dialog" aria-label="Image preview"><img alt=""></div>

<script src="assets/data.js?v=4"></script>
<script src="assets/common.js?v=4"></script>
<script>
const p = new URLSearchParams(location.search);
const cat = DATA.find(c => c.key === p.get('c'));
const q = cat && cat.questions.find(x => x.n === Number(p.get('n')));

if (!q) {
  document.getElementById('panel').innerHTML = '<h2 class="q-prompt">Question not found</h2><a class="btn" href="board.html">Back to categories</a> <a class="btn" href="index.html">Main menu</a>';
} else {
  document.title = cat.en + ' #' + q.n + ' - Game Jeopardy - Gamers Week';
  used.add(cat.key, q.n);

  document.getElementById('jp').textContent = cat.jp;
  document.getElementById('en').textContent = cat.en;
  document.getElementById('no').textContent = '#' + q.n;
  document.getElementById('prompt').textContent = q.prompt;
  if (q.difficulty) { const dEl = document.getElementById('diff'); dEl.hidden = false; dEl.dataset.d = q.difficulty; dEl.textContent = diffLabel(q.difficulty); }

  const media = document.getElementById('media');
  if (q.img) {
    const im = document.createElement('img');
    im.className = 'q-img' + (q.cutout ? ' cutout' : ''); im.src = q.img; im.alt = cat.en + ' question ' + q.n;
    im.onclick = () => { const lb = document.getElementById('lightbox'); const li = lb.querySelector('img'); li.src = q.img; li.className = q.cutout ? 'cutout' : ''; lb.classList.add('open'); };
    media.append(im);
  }
  if (q.audio) {
    const box = document.createElement('div');
    box.className = 'q-audio';
    box.innerHTML = '<div class="big">♪</div>';
    const a = document.createElement('audio');
    a.controls = true; a.src = q.audio; a.preload = 'auto'; a.id = 'clip';
    box.append(a);
    media.append(box);
  }

  document.getElementById('a-title').textContent = q.answer;
  document.getElementById('a-detail').textContent = q.detail;

  // ---- question state: hint (multiple choice) and result ----
  let choiceList = choicesFor(cat, q);
  let rightIdx = choiceList.indexOf(q.answer);
  const choicesEl = document.getElementById('choices'), ans = document.getElementById('answer');
  const hintBtn = document.getElementById('hint'), correctBtn = document.getElementById('correct');
  let hinted = false, result = null;   // result: null | 'win' | 'lose'

  const view = () => ({ page: 'question', c: cat.key, n: q.n, revealed: result !== null, hint: hinted, result });
  window.pageView = view;
  const tell = () => announce(view());

  function buildChoices() {
    choicesEl.textContent = '';
    choiceList.forEach((text, i) => {
      const b = document.createElement('button');
      b.className = 'choice'; b.dataset.i = i;
      b.innerHTML = '<span class="letter"></span><span class="t"></span>';
      b.children[0].textContent = 'ABCD'[i]; b.children[1].textContent = text;
      b.onclick = () => pick(i);
      choicesEl.append(b);
    });
  }
  function showChoices() {
    if (hinted || result) return;
    hinted = true;
    buildChoices();
    choicesEl.classList.add('show');
    hintBtn.disabled = true;
    tell();
  }
  function showAnswer(kind) {
    ans.classList.toggle('lost', kind === 'lose');
    document.getElementById('a-label').textContent = kind === 'lose' ? 'The correct answer was' : 'Correct answer!';
    ans.classList.remove('show'); void ans.offsetWidth; ans.classList.add('show');
  }
  function finish(kind, picked) {
    if (result) return;
    result = kind;
    hintBtn.disabled = true; correctBtn.disabled = true;
    if (hinted) {
      choicesEl.querySelectorAll('.choice').forEach((b, i) => {
        b.disabled = true;
        if (i === rightIdx) b.classList.add('right');
        else if (i === picked) b.classList.add('wrong');
        else b.classList.add('dim');
      });
    }
    showAnswer(kind);
    celebrate(kind);
    tell();
  }
  function pick(i) { if (hinted && !result) finish(i === rightIdx ? 'win' : 'lose', i); }
  function reset() {
    hinted = false; result = null;
    choicesEl.classList.remove('show'); choicesEl.textContent = '';
    ans.classList.remove('show');
    hintBtn.disabled = false; correctBtn.disabled = false;
    tell();
  }

  hintBtn.onclick = showChoices;
  correctBtn.onclick = () => finish('win', rightIdx);

  // the host view can drive this screen: hint, correct answer, pick a choice, reset, audio
  Bus.on(m => {
    if (!TV) return;
    if (m.type === 'hint') {
      // use the exact choices the host is showing, so both screens always match
      if (Array.isArray(m.choices) && m.choices.includes(q.answer)) { choiceList = m.choices; rightIdx = choiceList.indexOf(q.answer); }
      showChoices();
    }
    if (m.type === 'correct') finish('win', rightIdx);
    if (m.type === 'pick') pick(m.i);
    if (m.type === 'reset') reset();
    if (m.type === 'audio') {
      const clip = document.getElementById('clip'); if (!clip) return;
      if (m.action === 'pause') clip.pause();
      else {
        if (m.action === 'restart') clip.currentTime = 0;
        clip.play().catch(() => Bus.send({ type: 'audioblocked' }));
      }
    }
  });
  tell();
  openFlash();

  document.getElementById('back').href = 'category.html?c=' + cat.key + tvQS();
}

const lb = document.getElementById('lightbox');
lb.onclick = () => lb.classList.remove('open');
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (lb.classList.contains('open')) lb.classList.remove('open'); else if (!TV && q) location.href = 'category.html?c=' + cat.key; }
});
</script>
</body>
</html>
